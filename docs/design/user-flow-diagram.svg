<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0F1111; font-family: Inter, system-ui, sans-serif;">
  <text x="480" y="38" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">End-to-End User Flow — Amazon Re-imagined</text>
  
  <!-- Flow Steps -->
  <!-- 1. Discovery -->
  <g transform="translate(40, 80)">
    <rect width="160" height="130" rx="8" fill="#1E293B" stroke="#00A8E1" stroke-width="2" />
    <text x="80" y="35" text-anchor="middle" fill="#00A8E1" font-size="14" font-weight="700">1. DISCOVERY</text>
    <text x="80" y="65" text-anchor="middle" fill="#FFFFFF" font-size="12">Home Landing</text>
    <text x="80" y="85" text-anchor="middle" fill="#94A3B8" font-size="11">Hero Carousel</text>
    <text x="80" y="105" text-anchor="middle" fill="#94A3B8" font-size="11">Deals Countdown</text>
  </g>

  <!-- Arrow -->
  <line x1="200" y1="145" x2="230" y2="145" stroke="#FF9900" stroke-width="2" />
  
  <!-- 2. Search & Filter -->
  <g transform="translate(230, 80)">
    <rect width="160" height="130" rx="8" fill="#1E293B" stroke="#00A8E1" stroke-width="2" />
    <text x="80" y="35" text-anchor="middle" fill="#00A8E1" font-size="14" font-weight="700">2. SEARCH &amp; FILTER</text>
    <text x="80" y="65" text-anchor="middle" fill="#FFFFFF" font-size="12">Instant Omnibar</text>
    <text x="80" y="85" text-anchor="middle" fill="#94A3B8" font-size="11">Faceted Sidebar</text>
    <text x="80" y="105" text-anchor="middle" fill="#94A3B8" font-size="11">Filter Pills</text>
  </g>

  <!-- Arrow -->
  <line x1="390" y1="145" x2="420" y2="145" stroke="#FF9900" stroke-width="2" />

  <!-- 3. Evaluation & PDP -->
  <g transform="translate(420, 80)">
    <rect width="160" height="130" rx="8" fill="#1E293B" stroke="#FF9900" stroke-width="2" />
    <text x="80" y="35" text-anchor="middle" fill="#FF9900" font-size="14" font-weight="700">3. EVALUATION</text>
    <text x="80" y="65" text-anchor="middle" fill="#FFFFFF" font-size="12">Quick Peek / PDP</text>
    <text x="80" y="85" text-anchor="middle" fill="#94A3B8" font-size="11">AI Review Digest</text>
    <text x="80" y="105" text-anchor="middle" fill="#94A3B8" font-size="11">Comparison Dock</text>
  </g>

  <!-- Arrow -->
  <line x1="580" y1="145" x2="610" y2="145" stroke="#FF9900" stroke-width="2" />

  <!-- 4. Cart & Buy Box -->
  <g transform="translate(610, 80)">
    <rect width="160" height="130" rx="8" fill="#1E293B" stroke="#00A8E1" stroke-width="2" />
    <text x="80" y="35" text-anchor="middle" fill="#00A8E1" font-size="14" font-weight="700">4. CART &amp; BUY BOX</text>
    <text x="80" y="65" text-anchor="middle" fill="#FFFFFF" font-size="12">Delivery Countdown</text>
    <text x="80" y="85" text-anchor="middle" fill="#94A3B8" font-size="11">Slide-out Drawer</text>
    <text x="80" y="105" text-anchor="middle" fill="#94A3B8" font-size="11">Free Shipping Bar</text>
  </g>

  <!-- Arrow -->
  <line x1="770" y1="145" x2="800" y2="145" stroke="#FF9900" stroke-width="2" />

  <!-- 5. 2-Step Checkout -->
  <g transform="translate(800, 80)">
    <rect width="130" height="130" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2" />
    <text x="65" y="35" text-anchor="middle" fill="#10B981" font-size="13" font-weight="700">5. CHECKOUT</text>
    <text x="65" y="65" text-anchor="middle" fill="#FFFFFF" font-size="11">1. Address/Speed</text>
    <text x="65" y="85" text-anchor="middle" fill="#94A3B8" font-size="11">2. Payment</text>
    <text x="65" y="105" text-anchor="middle" fill="#94A3B8" font-size="11">Place Order</text>
  </g>

  <!-- Return Loop: Orders & Tracking -->
  <g transform="translate(230, 280)">
    <rect width="500" height="120" rx="8" fill="#131921" stroke="#334155" stroke-width="1.5" />
    <text x="250" y="315" text-anchor="middle" fill="#FF9900" font-size="15" font-weight="700">6. POST-PURCHASE &amp; FULFILLMENT TRACKING</text>
    <text x="250" y="345" text-anchor="middle" fill="#FFFFFF" font-size="13">Amazon Order ID Generated (114-XXXXXXX-XXXXXXX)</text>
    <text x="250" y="370" text-anchor="middle" fill="#94A3B8" font-size="12">Interactive 4-Stage Stepper: Ordered → Processing → Out for Delivery → Delivered</text>
  </g>

  <!-- Connector from Checkout to Orders -->
  <path d="M 865 210 L 865 340 L 730 340" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4" />
</svg>
