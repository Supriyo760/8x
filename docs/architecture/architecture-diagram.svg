<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" style="background:#0F1111; font-family: Inter, system-ui, sans-serif;">
  <defs>
    <linearGradient id="amazonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#E47911" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">Amazon Re-imagined — Technical Architecture</text>
  <text x="450" y="65" text-anchor="middle" fill="#94A3B8" font-size="14">Client-Side Architecture with Localized Data Engine &amp; Persistence</text>

  <!-- Presentation Layer -->
  <rect x="40" y="100" width="820" height="150" rx="8" fill="#131921" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="130" fill="#00A8E1" font-size="16" font-weight="600">1. PRESENTATION LAYER (React 19 + Tailwind CSS + Lucide)</text>
  
  <rect x="60" y="150" width="170" height="80" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="145" y="185" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Global Header &amp; Nav</text>
  <text x="145" y="205" text-anchor="middle" fill="#94A3B8" font-size="11">Omnibar, Deliver-To, Cart</text>

  <rect x="250" y="150" width="180" height="80" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="340" y="185" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Catalog &amp; Faceted Grid</text>
  <text x="340" y="205" text-anchor="middle" fill="#94A3B8" font-size="11">Filter Pills, Sort, Quick-Peek</text>

  <rect x="450" y="150" width="180" height="80" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="540" y="185" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Product Detail Page (PDP)</text>
  <text x="540" y="205" text-anchor="middle" fill="#94A3B8" font-size="11">Zoom, Variants, Buy Box</text>

  <rect x="650" y="150" width="190" height="80" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="745" y="185" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Checkout &amp; Orders</text>
  <text x="745" y="205" text-anchor="middle" fill="#94A3B8" font-size="11">2-Step Modal, Tracking Stepper</text>

  <!-- Connectors -->
  <line x1="450" y1="250" x2="450" y2="280" stroke="#FF9900" stroke-width="2" stroke-dasharray="4" />

  <!-- Business Logic Layer -->
  <rect x="40" y="280" width="820" height="150" rx="8" fill="#131921" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="310" fill="#FF9900" font-size="16" font-weight="600">2. APPLICATION LOGIC &amp; STATE ENGINE</text>

  <rect x="60" y="330" width="240" height="80" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="180" y="365" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Search &amp; Filter Indexer</text>
  <text x="180" y="385" text-anchor="middle" fill="#94A3B8" font-size="11">Compound AND/OR Facets</text>

  <rect x="330" y="330" width="240" height="80" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="450" y="365" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Cart &amp; Buy-Box Calculator</text>
  <text x="450" y="385" text-anchor="middle" fill="#94A3B8" font-size="11">Taxes, Free Shipping, Variants</text>

  <rect x="600" y="330" width="240" height="80" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="720" y="365" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">Order &amp; Fulfillment Engine</text>
  <text x="720" y="385" text-anchor="middle" fill="#94A3B8" font-size="11">Order ID Generator &amp; Timeline</text>

  <!-- Connectors -->
  <line x1="450" y1="430" x2="450" y2="460" stroke="#00A8E1" stroke-width="2" stroke-dasharray="4" />

  <!-- Data Layer -->
  <rect x="40" y="460" width="820" height="110" rx="8" fill="#131921" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="490" fill="#10B981" font-size="16" font-weight="600">3. DATA &amp; STORAGE TIER</text>

  <rect x="150" y="505" width="280" height="50" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="290" y="535" text-anchor="middle" fill="#FFFFFF" font-size="13">50+ Product Mock Catalog (JSON/TS)</text>

  <rect x="470" y="505" width="280" height="50" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="610" y="535" text-anchor="middle" fill="#FFFFFF" font-size="13">LocalStorage (Cart, Orders, Wishlist)</text>
</svg>
