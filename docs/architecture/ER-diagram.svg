<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#0F1111; font-family: Inter, system-ui, sans-serif;">
  <text x="480" y="38" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">Entity Relationship (ER) Diagram — Amazon Re-imagined</text>
  
  <!-- CATEGORIES -->
  <g transform="translate(60, 80)">
    <rect width="200" height="110" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 200 0 L 200 28 L 0 28 Z" fill="#00A8E1" rx="6" />
    <text x="100" y="20" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">CATEGORIES</text>
    <text x="15" y="48" fill="#F8FAFC" font-size="11">PK  id : varchar</text>
    <text x="15" y="68" fill="#94A3B8" font-size="11">    name : varchar</text>
    <text x="15" y="88" fill="#94A3B8" font-size="11">    slug : varchar</text>
  </g>

  <!-- PRODUCTS -->
  <g transform="translate(360, 80)">
    <rect width="240" height="260" rx="6" fill="#1E293B" stroke="#FF9900" stroke-width="2" />
    <path d="M 0 0 L 240 0 L 240 28 L 0 28 Z" fill="#FF9900" rx="6" />
    <text x="120" y="20" text-anchor="middle" fill="#131921" font-size="12" font-weight="700">PRODUCTS (Core Catalog)</text>
    <text x="15" y="48" fill="#F8FAFC" font-size="11">PK  id : varchar</text>
    <text x="15" y="68" fill="#F8FAFC" font-size="11">FK  category_id : varchar</text>
    <text x="15" y="88" fill="#94A3B8" font-size="11">    title : varchar</text>
    <text x="15" y="108" fill="#94A3B8" font-size="11">    brand : varchar</text>
    <text x="15" y="128" fill="#94A3B8" font-size="11">    price : decimal</text>
    <text x="15" y="148" fill="#94A3B8" font-size="11">    rating : decimal</text>
    <text x="15" y="168" fill="#94A3B8" font-size="11">    is_prime : boolean</text>
    <text x="15" y="188" fill="#94A3B8" font-size="11">    stock_count : int</text>
    <text x="15" y="208" fill="#94A3B8" font-size="11">    in_stock : boolean</text>
    <text x="15" y="228" fill="#94A3B8" font-size="11">    delivery_days : int</text>
  </g>

  <!-- PRODUCT_VARIANTS -->
  <g transform="translate(680, 80)">
    <rect width="220" height="150" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 28 L 0 28 Z" fill="#00A8E1" rx="6" />
    <text x="110" y="20" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">PRODUCT_VARIANTS</text>
    <text x="15" y="48" fill="#F8FAFC" font-size="11">PK  id : varchar</text>
    <text x="15" y="68" fill="#F8FAFC" font-size="11">FK  product_id : varchar</text>
    <text x="15" y="88" fill="#94A3B8" font-size="11">    variant_type : varchar</text>
    <text x="15" y="108" fill="#94A3B8" font-size="11">    label : varchar</text>
    <text x="15" y="128" fill="#94A3B8" font-size="11">    price_modifier : decimal</text>
  </g>

  <!-- AI_REVIEW_DIGEST -->
  <g transform="translate(680, 270)">
    <rect width="220" height="130" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 28 L 0 28 Z" fill="#10B981" rx="6" />
    <text x="110" y="20" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">AI_REVIEW_DIGESTS</text>
    <text x="15" y="48" fill="#F8FAFC" font-size="11">PK/FK product_id : varchar</text>
    <text x="15" y="68" fill="#94A3B8" font-size="11">      verdict : text</text>
    <text x="15" y="88" fill="#94A3B8" font-size="11">      pros : jsonb</text>
    <text x="15" y="108" fill="#94A3B8" font-size="11">      cons : jsonb</text>
  </g>

  <!-- ORDERS -->
  <g transform="translate(60, 390)">
    <rect width="220" height="190" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 220 0 L 220 28 L 0 28 Z" fill="#F59E0B" rx="6" />
    <text x="110" y="20" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">ORDERS</text>
    <text x="15" y="48" fill="#F8FAFC" font-size="11">PK  id : varchar (114-X)</text>
    <text x="15" y="68" fill="#94A3B8" font-size="11">    status : varchar</text>
    <text x="15" y="88" fill="#94A3B8" font-size="11">    subtotal : decimal</text>
    <text x="15" y="108" fill="#94A3B8" font-size="11">    tax : decimal</text>
    <text x="15" y="128" fill="#94A3B8" font-size="11">    total : decimal</text>
    <text x="15" y="148" fill="#94A3B8" font-size="11">    tracking_number : varchar</text>
    <text x="15" y="168" fill="#94A3B8" font-size="11">    estimated_date : date</text>
  </g>

  <!-- ORDER_ITEMS -->
  <g transform="translate(360, 420)">
    <rect width="240" height="150" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 240 0 L 240 28 L 0 28 Z" fill="#F59E0B" rx="6" />
    <text x="120" y="20" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">ORDER_ITEMS</text>
    <text x="15" y="48" fill="#F8FAFC" font-size="11">PK  id : int</text>
    <text x="15" y="68" fill="#F8FAFC" font-size="11">FK  order_id : varchar</text>
    <text x="15" y="88" fill="#F8FAFC" font-size="11">FK  product_id : varchar</text>
    <text x="15" y="108" fill="#94A3B8" font-size="11">FK  variant_id : varchar</text>
    <text x="15" y="128" fill="#94A3B8" font-size="11">    quantity : int</text>
  </g>

  <!-- Connectors -->
  <!-- Categories -> Products -->
  <line x1="260" y1="135" x2="360" y2="135" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Products -> Variants -->
  <line x1="600" y1="140" x2="680" y2="140" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Products -> AI Digest -->
  <line x1="600" y1="310" x2="680" y2="310" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Orders -> Order Items -->
  <line x1="280" y1="480" x2="360" y2="480" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Products -> Order Items -->
  <line x1="480" y1="340" x2="480" y2="420" stroke="#94A3B8" stroke-width="1.5" />
</svg>
